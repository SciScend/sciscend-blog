# SciScend — nginx site config for the Bullinfo VPS.
#
# Source of truth since 2026-09-22: this file in the sciscend-blog repo (moved
# from sciscend-web, which is on hold). It serves two static trees, both rsynced
# up; no Node process runs:
#   /       → /var/www/sciscend.com/html   the coming-soon placeholder
#   /blog/  → /var/www/sciscend.com/blog   the blog (this repo's dist/)
#
# Live path on the server: /etc/nginx/sites-available/sciscend.com
#   sudo cp deploy/nginx-sciscend.conf /etc/nginx/sites-available/sciscend.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is already issued and auto-renewed by certbot's systemd timer
# (cert name: sciscend.com, covers sciscend.com + www.sciscend.com).
# Re-issue only if the cert is ever lost:
#   sudo certbot --nginx -d sciscend.com -d www.sciscend.com
#
# Note: sciscend.com sits behind Cloudflare (proxied DNS), so client IPs in the
# access log are Cloudflare's unless real-IP restoration is configured.

# www → apex. The canonical URL (src/site.config.ts → SITE.origin) is the apex, and
# every page emits <link rel="canonical"> pointing there; redirecting keeps www
# from serving a duplicate copy of the whole site. The certbot cert covers both.
server {
    listen 443 ssl;
    server_name www.sciscend.com;

    ssl_certificate /etc/letsencrypt/live/sciscend.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sciscend.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://sciscend.com$request_uri;
}

server {
    server_name sciscend.com;

    # The placeholder (deploy/placeholder/, `npm run deploy:placeholder`).
    root /var/www/sciscend.com/html;
    index index.html;

    # --- compression (a real SEO/perf signal) ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml application/rss+xml image/svg+xml
        application/manifest+json text/markdown;

    # --- clean URLs for Astro's directory build format ---
    # $uri/index.html comes BEFORE $uri/ on purpose: matching the directory
    # itself makes nginx emit an external 301 to add the trailing slash, so
    # every internal link (/courses) would cost an extra round trip. Serving
    # the index file directly answers /courses with 200.
    #
    # The HTML cache policy lives HERE rather than in a `location ~* \.html$`
    # block: try_files serves the resolved file inside this location without
    # re-matching, so a regex location would silently miss every subpage.
    # Hashed assets, images and the SEO files all have their own locations
    # below (regex + exact matches win over this prefix), so what reaches this
    # block is the HTML — which must revalidate so deploys show up at once.
    location / {
        try_files $uri $uri/index.html $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- the blog: /blog/ is served from /var/www/sciscend.com/blog/ ---
    # A sibling of html/, not a subfolder of it: the placeholder deploy
    # (rsync --delete into html/) and the blog deploy (rsync --delete into
    # blog/) can never wipe each other.
    #
    # `^~` is required. Without it the server-level image regex below would win
    # for /blog/*.png and look for the file under html/, so every blog image
    # would 404. For the same reason the blog's asset caching is nested here.
    location = /blog { return 301 /blog/; }

    location ^~ /blog/ {
        root /var/www/sciscend.com;
        charset utf-8;
        try_files $uri $uri/index.html =404;
        error_page 404 /blog/404.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location ^~ /blog/_astro/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        location = /blog/llms.txt       { default_type text/plain; add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options "nosniff" always; }
        location = /blog/rss.xml        { types { } default_type application/rss+xml; add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options "nosniff" always; }
        location = /blog/sitemap-index.xml { types { } default_type application/xml; }
        location ~ ^/blog/sitemap-\d+\.xml$ { types { } default_type application/xml; }
    }

    # --- long-cache immutable hashed assets ---
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated because nginx's add_header does NOT inherit into a location
        # that declares any add_header of its own. Same below.
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # --- images/fonts: cache a while ---
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # --- SEO/agent files: always fresh, correct content-types ---
    # nginx's mime.types has no .webmanifest entry, so it would fall back to
    # application/octet-stream.
    location = /site.webmanifest { types { } default_type application/manifest+json; }

    location = /robots.txt   { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options "nosniff" always; }
    location = /llms.txt     { default_type text/plain; add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options "nosniff" always; }
    # `types { }` empties the MIME map for these locations so default_type is
    # actually used — otherwise .xml resolves to text/xml from mime.types and
    # default_type (a fallback, not an override) never gets a say.
    location = /sitemap-index.xml { types { } default_type application/xml; }
    location = /sitemap-0.xml     { types { } default_type application/xml; }
    location = /rss.xml           { types { } default_type application/rss+xml; }

    # --- security headers (apply to responses from locations that set none) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sciscend.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sciscend.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.sciscend.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = sciscend.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sciscend.com www.sciscend.com;
    return 404; # managed by Certbot
}
