<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Класически класификатор с вградени класове срещу zero-shot класификатор с класове във входа">
<title>Класически класификатор с вградени класове срещу zero-shot класификатор с класове във входа</title>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif; fill: #353535; }
  .soft { fill: #5c5f63; } .faint { fill: #7a7e83; }
  .mono { font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .panel { fill: #f4f7f8; stroke: #e3e8ea; }
  .card { fill: #ffffff; stroke: #d5dcdf; }
  .line { stroke: #9aa0a5; fill: none; }
  .ah { fill: #9aa0a5; }
  .grid { stroke: #e3e8ea; }
  .track { fill: #e3e8ea; }
  .jev { fill: #0b6f68; } .jevTint { fill: #e3f6f4; stroke: #13b0a5; } .jevInk { fill: #0b6f68; }
  .llm { fill: #0050a7; } .llmTint { fill: #e6eef8; stroke: #5b8fd0; } .llmInk { fill: #0050a7; }
  .hum { fill: #b86a00; } .humTint { fill: #fbf0e0; stroke: #d99a3e; } .humInk { fill: #8a4f00; }
  .mid { fill: #c9ced2; } .midTint { fill: #eef1f3; stroke: #b7bec3; }
  .bar2 { fill: #b8bdc1; }
  .onDark { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e7e9ea; }
    .soft { fill: #b3b8bc; } .faint { fill: #8b9196; }
    .panel { fill: #1b1f22; stroke: #2a3034; }
    .card { fill: #131618; stroke: #353c41; }
    .line { stroke: #6d7479; } .ah { fill: #6d7479; }
    .grid { stroke: #2a3034; } .track { fill: #2a3034; }
    .jev { fill: #2cc9bd; } .jevTint { fill: #15302e; stroke: #2cc9bd; } .jevInk { fill: #7fe3da; }
    .llm { fill: #6fb0ff; } .llmTint { fill: #16253a; stroke: #4d7fbf; } .llmInk { fill: #9cc8ff; }
    .hum { fill: #f0b050; } .humTint { fill: #35270f; stroke: #b8862e; } .humInk { fill: #f5c77a; }
    .mid { fill: #4a5156; } .midTint { fill: #22272b; stroke: #454c51; }
    .bar2 { fill: #5c6166; }
    .onDark { fill: #131618; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<rect x="20" y="20" width="280" height="300" rx="12" class="panel"/>
<text x="40" y="50" font-size="15" font-weight="700" text-anchor="start">Класически класификатор</text>
<text x="40" y="70" font-size="12" font-weight="400" text-anchor="start" class="soft">класовете са вградени в модела</text>
<rect x="40" y="150" width="60" height="40" rx="8" class="card"/>
<text x="70" y="175" font-size="13" font-weight="400" text-anchor="middle">текст</text>
<line x1="102" y1="170" x2="118" y2="170" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="122" y="130" width="60" height="80" rx="10" class="mid"/>
<text x="152" y="175" font-size="12" font-weight="400" text-anchor="middle">модел</text>
<path d="M184,170 C194,170 194,125 202,125" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="214" cy="125" r="9" class="midTint" stroke-width="1.5"/>
<text x="229" y="129" font-size="11" font-weight="400" text-anchor="start" class="mono soft">billing</text>
