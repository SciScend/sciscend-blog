<circle cx="214" cy="170" r="9" class="midTint" stroke-width="1.5"/>
<text x="229" y="174" font-size="11" font-weight="400" text-anchor="start" class="mono soft">technical</text>
<path d="M184,170 C194,170 194,215 202,215" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<circle cx="214" cy="215" r="9" class="midTint" stroke-width="1.5"/>
<text x="229" y="219" font-size="11" font-weight="400" text-anchor="start" class="mono soft">sales</text>
<text x="40" y="278" font-size="12" font-weight="600" text-anchor="start" class="humInk">нов клас -> нови етикетирани</text>
<text x="40" y="295" font-size="12" font-weight="600" text-anchor="start" class="humInk">примери и ново обучение</text>
<rect x="316" y="20" width="424" height="300" rx="12" class="jevTint"/>
<text x="336" y="50" font-size="15" font-weight="700" text-anchor="start" class="jevInk">Zero-shot класификатор</text>
<text x="336" y="70" font-size="12" font-weight="400" text-anchor="start" class="soft">класовете са част от входа: f(текст, описание) -> число</text>
<rect x="336" y="96" width="168" height="40" rx="8" class="card"/>
<text x="346" y="113" font-size="11" font-weight="400" text-anchor="start" class="faint">текст +</text>
<text x="346" y="128" font-size="12" font-weight="400" text-anchor="start" class="mono">Payment, invoice...</text>
<line x1="506" y1="116" x2="524" y2="116" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="528" y="101" width="34" height="30" rx="7" class="jev"/>
<text x="545" y="121" font-size="14" font-weight="700" text-anchor="middle" class="onDark">f</text>
<line x1="564" y1="116" x2="582" y2="116" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="588" y="121" font-size="13" font-weight="400" text-anchor="start" class="mono">2.1</text>
<rect x="336" y="152" width="168" height="40" rx="8" class="card"/>
<text x="346" y="169" font-size="11" font-weight="400" text-anchor="start" class="faint">текст +</text>
<text x="346" y="184" font-size="12" font-weight="400" text-anchor="start" class="mono">Bugs, errors...</text>
<line x1="506" y1="172" x2="524" y2="172" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="528" y="157" width="34" height="30" rx="7" class="jev"/>
<text x="545" y="177" font-size="14" font-weight="700" text-anchor="middle" class="onDark">f</text>
<line x1="564" y1="172" x2="582" y2="172" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="588" y="177" font-size="13" font-weight="400" text-anchor="start" class="mono">4.3</text>
<rect x="336" y="208" width="168" height="40" rx="8" class="card"/>
<text x="346" y="225" font-size="11" font-weight="400" text-anchor="start" class="faint">текст +</text>
<text x="346" y="240" font-size="12" font-weight="400" text-anchor="start" class="mono">Pricing, seats...</text>
<line x1="506" y1="228" x2="524" y2="228" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="528" y="213" width="34" height="30" rx="7" class="jev"/>
<text x="545" y="233" font-size="14" font-weight="700" text-anchor="middle" class="onDark">f</text>
<line x1="564" y1="228" x2="582" y2="228" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="588" y="233" font-size="13" font-weight="400" text-anchor="start" class="mono">0.2</text>
<rect x="622" y="96" width="30" height="152" rx="7" class="card"/>
<text x="641" y="172" font-size="12" text-anchor="middle" transform="rotate(-90 641 172)" class="soft">softmax</text>
<line x1="654" y1="116" x2="672" y2="116" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="678" y="121" font-size="14" font-weight="400" text-anchor="start" class="soft">0.10</text>
<line x1="654" y1="172" x2="672" y2="172" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="678" y="177" font-size="14" font-weight="700" text-anchor="start" class="jevInk">0.89</text>
<line x1="654" y1="228" x2="672" y2="228" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="678" y="233" font-size="14" font-weight="400" text-anchor="start" class="soft">0.01</text>
<text x="336" y="278" font-size="12" font-weight="600" text-anchor="start" class="jevInk">етикетът няма собствен неврон - моделът чете описанието;</text>
<text x="336" y="295" font-size="12" font-weight="600" text-anchor="start" class="jevInk">опциите може да са различни при всяко извикване</text>
</svg>
