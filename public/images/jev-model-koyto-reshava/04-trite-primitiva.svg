<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" aria-label="Трите примитива: Noul, Choice и Score и какво връща всеки">
<title>Трите примитива: Noul, Choice и Score и какво връща всеки</title>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif; fill: #353535; }
  .soft { fill: #5c5f63; } .faint { fill: #7a7e83; }
  .mono { font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .panel { fill: #f4f7f8; stroke: #e3e8ea; }
  .card { fill: #ffffff; stroke: #d5dcdf; }
  .line { stroke: #9aa0a5; fill: none; }
  .ah { fill: #9aa0a5; }
  .grid { stroke: #e3e8ea; }
  .track { fill: #e3e8ea; }
  .jev { fill: #0b6f68; } .jevTint { fill: #e3f6f4; stroke: #13b0a5; } .jevInk { fill: #0b6f68; }
  .llm { fill: #0050a7; } .llmTint { fill: #e6eef8; stroke: #5b8fd0; } .llmInk { fill: #0050a7; }
  .hum { fill: #b86a00; } .humTint { fill: #fbf0e0; stroke: #d99a3e; } .humInk { fill: #8a4f00; }
  .mid { fill: #c9ced2; } .midTint { fill: #eef1f3; stroke: #b7bec3; }
  .bar2 { fill: #b8bdc1; }
  .onDark { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e7e9ea; }
    .soft { fill: #b3b8bc; } .faint { fill: #8b9196; }
    .panel { fill: #1b1f22; stroke: #2a3034; }
    .card { fill: #131618; stroke: #353c41; }
    .line { stroke: #6d7479; } .ah { fill: #6d7479; }
    .grid { stroke: #2a3034; } .track { fill: #2a3034; }
    .jev { fill: #2cc9bd; } .jevTint { fill: #15302e; stroke: #2cc9bd; } .jevInk { fill: #7fe3da; }
    .llm { fill: #6fb0ff; } .llmTint { fill: #16253a; stroke: #4d7fbf; } .llmInk { fill: #9cc8ff; }
    .hum { fill: #f0b050; } .humTint { fill: #35270f; stroke: #b8862e; } .humInk { fill: #f5c77a; }
    .mid { fill: #4a5156; } .midTint { fill: #22272b; stroke: #454c51; }
    .bar2 { fill: #5c6166; }
    .onDark { fill: #131618; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<rect x="20" y="20" width="230" height="250" rx="12" class="panel"/>
<text x="38" y="52" font-size="20" font-weight="700" text-anchor="start" class="jevInk">Noul</text>
<text x="38" y="74" font-size="13" font-weight="400" text-anchor="start" class="soft">да / не</text>
<rect x="265" y="20" width="230" height="250" rx="12" class="panel"/>
<text x="283" y="52" font-size="20" font-weight="700" text-anchor="start" class="jevInk">Choice</text>
<text x="283" y="74" font-size="13" font-weight="400" text-anchor="start" class="soft">една от няколко опции</text>
<rect x="510" y="20" width="230" height="250" rx="12" class="panel"/>
<text x="528" y="52" font-size="20" font-weight="700" text-anchor="start" class="jevInk">Score</text>
<text x="528" y="74" font-size="13" font-weight="400" text-anchor="start" class="soft">позиция по скала</text>
<text x="38" y="110" font-size="13" font-weight="400" text-anchor="start" class="soft">'Съобщението е спешно'</text>
<rect x="38" y="132" width="194" height="18" rx="5" class="track"/>
<path d="M38,132 H222 Q226,132 226,136 V146 Q226,150 222,150 H38 Z" class="jev"/>
<text x="38" y="170" font-size="11" font-weight="400" text-anchor="start" class="faint">0</text>
<text x="232" y="170" font-size="11" font-weight="400" text-anchor="end" class="faint">1</text>
<text x="38" y="206" font-size="18" font-weight="700" text-anchor="start" class="mono">noul = 0.97</text>
<text x="38" y="250" font-size="12" font-weight="400" text-anchor="start" class="faint">-> една вероятност, че е 'да'</text>
<text x="283" y="113" font-size="12" font-weight="400" text-anchor="start" class="mono">technical</text>
<rect x="358" y="101" width="96" height="14" rx="4" class="track"/>
<path d="M358,101 H436 Q440,101 440,105 V111 Q440,115 436,115 H358 Z" class="jev"/>
<text x="460" y="113" font-size="11" font-weight="400" text-anchor="start" class="soft">0.85</text>
<text x="283" y="143" font-size="12" font-weight="400" text-anchor="start" class="mono">billing</text>
<rect x="358" y="131" width="96" height="14" rx="4" class="track"/>
<path d="M358,131 H368 Q372,131 372,135 V141 Q372,145 368,145 H358 Z" class="bar2"/>
<text x="460" y="143" font-size="11" font-weight="400" text-anchor="start" class="soft">0.15</text>
<text x="283" y="173" font-size="12" font-weight="400" text-anchor="start" class="mono">sales</text>
<rect x="358" y="161" width="96" height="14" rx="4" class="track"/>

<text x="460" y="173" font-size="11" font-weight="400" text-anchor="start" class="soft">0.00</text>
<text x="283" y="206" font-size="15" font-weight="700" text-anchor="start" class="mono">choice = technical</text>
<text x="283" y="226" font-size="13" font-weight="400" text-anchor="start" class="mono soft">confidence = 0.78</text>
<text x="283" y="250" font-size="12" font-weight="400" text-anchor="start" class="faint">-> избор + разпределение</text>
<line x1="540" y1="140" x2="710" y2="140" class="line" stroke-width="3"/>
<circle cx="540.0" cy="140" r="5" class="mid"/>
<text x="540.0" y="164" font-size="12" font-weight="400" text-anchor="middle" class="faint">0</text>
<circle cx="625.0" cy="140" r="5" class="mid"/>
<text x="625.0" y="164" font-size="12" font-weight="400" text-anchor="middle" class="faint">1</text>
<circle cx="710.0" cy="140" r="5" class="mid"/>
<text x="710.0" y="164" font-size="12" font-weight="400" text-anchor="middle" class="faint">2</text>
<circle cx="659.0" cy="140" r="8" class="jev"/>
<text x="659.0" y="124" font-size="13" font-weight="700" text-anchor="middle" class="jevInk">1.4</text>
<text x="528" y="184" font-size="11" font-weight="400" text-anchor="start" class="mono soft">0: cosmetic</text>
<text x="528" y="198" font-size="11" font-weight="400" text-anchor="start" class="mono soft">1: workaround</text>
<text x="528" y="212" font-size="11" font-weight="400" text-anchor="start" class="mono soft">2: blocking</text>
<text x="528" y="232" font-size="15" font-weight="700" text-anchor="start" class="mono">score = 1.4</text>
<text x="528" y="250" font-size="12" font-weight="400" text-anchor="start" class="faint">-> позиция, може да е дробна</text>
</svg>
