<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" role="img" aria-label="Каскада: Jev маршрутизира към код, LLM или човек">
<title>Каскада: Jev маршрутизира към код, LLM или човек</title>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif; fill: #353535; }
  .soft { fill: #5c5f63; } .faint { fill: #7a7e83; }
  .mono { font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .panel { fill: #f4f7f8; stroke: #e3e8ea; }
  .card { fill: #ffffff; stroke: #d5dcdf; }
  .line { stroke: #9aa0a5; fill: none; }
  .ah { fill: #9aa0a5; }
  .grid { stroke: #e3e8ea; }
  .track { fill: #e3e8ea; }
  .jev { fill: #0b6f68; } .jevTint { fill: #e3f6f4; stroke: #13b0a5; } .jevInk { fill: #0b6f68; }
  .llm { fill: #0050a7; } .llmTint { fill: #e6eef8; stroke: #5b8fd0; } .llmInk { fill: #0050a7; }
  .hum { fill: #b86a00; } .humTint { fill: #fbf0e0; stroke: #d99a3e; } .humInk { fill: #8a4f00; }
  .mid { fill: #c9ced2; } .midTint { fill: #eef1f3; stroke: #b7bec3; }
  .bar2 { fill: #b8bdc1; }
  .onDark { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e7e9ea; }
    .soft { fill: #b3b8bc; } .faint { fill: #8b9196; }
    .panel { fill: #1b1f22; stroke: #2a3034; }
    .card { fill: #131618; stroke: #353c41; }
    .line { stroke: #6d7479; } .ah { fill: #6d7479; }
    .grid { stroke: #2a3034; } .track { fill: #2a3034; }
    .jev { fill: #2cc9bd; } .jevTint { fill: #15302e; stroke: #2cc9bd; } .jevInk { fill: #7fe3da; }
    .llm { fill: #6fb0ff; } .llmTint { fill: #16253a; stroke: #4d7fbf; } .llmInk { fill: #9cc8ff; }
    .hum { fill: #f0b050; } .humTint { fill: #35270f; stroke: #b8862e; } .humInk { fill: #f5c77a; }
    .mid { fill: #4a5156; } .midTint { fill: #22272b; stroke: #454c51; }
    .bar2 { fill: #5c6166; }
    .onDark { fill: #131618; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<rect x="20" y="118" width="100" height="44" rx="10" class="card"/>
<text x="70" y="145" font-size="14" font-weight="400" text-anchor="middle">заявка</text>
<line x1="122" y1="140" x2="158" y2="140" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="162" y="88" width="190" height="104" rx="12" class="jev"/>
<text x="257" y="118" font-size="20" font-weight="700" text-anchor="middle" class="onDark">Jev</text>
<text x="257" y="142" font-size="12" font-weight="400" text-anchor="middle" class="onDark">тип? сложност?</text>
<text x="257" y="158" font-size="12" font-weight="400" text-anchor="middle" class="onDark">увереност?</text>
<text x="257" y="178" font-size="11" font-weight="400" text-anchor="middle" class="onDark">~100 ms | части от цент</text>
<path d="M354,140 C390,140 390,60 424,60" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="428" y="30" width="310" height="60" rx="10" class="jevTint"/>
<text x="446" y="55" font-size="12" font-weight="400" text-anchor="start" class="soft">просто и сигурно</text>
<text x="446" y="76" font-size="15" font-weight="700" text-anchor="start" class="jevInk">-> обикновен код / шаблон</text>
<path d="M354,140 C390,140 390,148 424,148" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="428" y="118" width="310" height="60" rx="10" class="llmTint"/>
<text x="446" y="143" font-size="12" font-weight="400" text-anchor="start" class="soft">средно</text>
<text x="446" y="164" font-size="15" font-weight="700" text-anchor="start" class="llmInk">-> LLM специалист пише отговора</text>
<path d="M354,140 C390,140 390,236 424,236" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="428" y="206" width="310" height="60" rx="10" class="humTint"/>
<text x="446" y="231" font-size="12" font-weight="400" text-anchor="start" class="soft">ниска увереност / рисково</text>
<text x="446" y="252" font-size="15" font-weight="700" text-anchor="start" class="humInk">-> човек</text>
<text x="380" y="296" font-size="13" font-weight="600" text-anchor="middle" class="faint">Jev решава накъде. LLM прави генеративната работа. Кодът държи контрола.</text>
</svg>
