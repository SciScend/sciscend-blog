<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 308" width="760" height="308" role="img" aria-label="Една заявка: state и въпроси влизат, типизирани отговори излизат">
<title>Една заявка: state и въпроси влизат, типизирани отговори излизат</title>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif; fill: #353535; }
  .soft { fill: #5c5f63; } .faint { fill: #7a7e83; }
  .mono { font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .panel { fill: #f4f7f8; stroke: #e3e8ea; }
  .card { fill: #ffffff; stroke: #d5dcdf; }
  .line { stroke: #9aa0a5; fill: none; }
  .ah { fill: #9aa0a5; }
  .grid { stroke: #e3e8ea; }
  .track { fill: #e3e8ea; }
  .jev { fill: #0b6f68; } .jevTint { fill: #e3f6f4; stroke: #13b0a5; } .jevInk { fill: #0b6f68; }
  .llm { fill: #0050a7; } .llmTint { fill: #e6eef8; stroke: #5b8fd0; } .llmInk { fill: #0050a7; }
  .hum { fill: #b86a00; } .humTint { fill: #fbf0e0; stroke: #d99a3e; } .humInk { fill: #8a4f00; }
  .mid { fill: #c9ced2; } .midTint { fill: #eef1f3; stroke: #b7bec3; }
  .bar2 { fill: #b8bdc1; }
  .onDark { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e7e9ea; }
    .soft { fill: #b3b8bc; } .faint { fill: #8b9196; }
    .panel { fill: #1b1f22; stroke: #2a3034; }
    .card { fill: #131618; stroke: #353c41; }
    .line { stroke: #6d7479; } .ah { fill: #6d7479; }
    .grid { stroke: #2a3034; } .track { fill: #2a3034; }
    .jev { fill: #2cc9bd; } .jevTint { fill: #15302e; stroke: #2cc9bd; } .jevInk { fill: #7fe3da; }
    .llm { fill: #6fb0ff; } .llmTint { fill: #16253a; stroke: #4d7fbf; } .llmInk { fill: #9cc8ff; }
    .hum { fill: #f0b050; } .humTint { fill: #35270f; stroke: #b8862e; } .humInk { fill: #f5c77a; }
    .mid { fill: #4a5156; } .midTint { fill: #22272b; stroke: #454c51; }
    .bar2 { fill: #5c6166; }
    .onDark { fill: #131618; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<rect x="20" y="20" width="330" height="102" rx="10" class="card"/>
<text x="36" y="44" font-size="13" font-weight="600" text-anchor="start" class="mono faint">state</text>
<text x="36" y="68" font-size="14" font-weight="400" text-anchor="start">'Бутонът за експорт не работи от вчера,</text>
<text x="36" y="90" font-size="14" font-weight="400" text-anchor="start">а отчетът ми е за след два часа!'</text>
<rect x="20" y="138" width="330" height="150" rx="10" class="card"/>
<text x="36" y="162" font-size="13" font-weight="600" text-anchor="start" class="mono faint">questions</text>
<text x="36" y="190" font-size="13" font-weight="400" text-anchor="start" class="mono">urgent</text>
<text x="130" y="190" font-size="13" font-weight="700" text-anchor="start" class="jevInk">Noul</text>
<text x="130" y="206" font-size="12" font-weight="400" text-anchor="start" class="soft">'Съобщението е спешно'</text>
<text x="36" y="224" font-size="13" font-weight="400" text-anchor="start" class="mono">department</text>
<text x="130" y="224" font-size="13" font-weight="700" text-anchor="start" class="jevInk">Choice</text>
<text x="130" y="240" font-size="12" font-weight="400" text-anchor="start" class="soft">billing | technical | sales</text>
<text x="36" y="258" font-size="13" font-weight="400" text-anchor="start" class="mono">severity</text>
<text x="130" y="258" font-size="13" font-weight="700" text-anchor="start" class="jevInk">Score</text>
<text x="130" y="274" font-size="12" font-weight="400" text-anchor="start" class="soft">козметично ... блокиращо</text>
<path d="M352,71 C380,71 380,150 400,150" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M352,213 C380,213 380,165 400,165" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="404" y="110" width="132" height="96" rx="12" class="jev"/>
<text x="470" y="150" font-size="20" font-weight="700" text-anchor="middle" class="onDark">Jev</text>
<text x="470" y="172" font-size="12" font-weight="400" text-anchor="middle" class="onDark">едно изчисление</text>
<text x="470" y="188" font-size="12" font-weight="400" text-anchor="middle" class="onDark">70-500 ms</text>
<line x1="538" y1="158" x2="566" y2="158" class="line" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="470" y="232" font-size="12" font-weight="400" text-anchor="middle" class="faint">чете state веднъж,</text>
<text x="470" y="249" font-size="12" font-weight="400" text-anchor="middle" class="faint">отговаря на всички</text>
<text x="470" y="266" font-size="12" font-weight="400" text-anchor="middle" class="faint">въпроси паралелно</text>
<rect x="570" y="40" width="170" height="236" rx="10" class="jevTint"/>
<text x="586" y="64" font-size="13" font-weight="600" text-anchor="start" class="mono jevInk">answers</text>
<text x="586" y="100" font-size="12" font-weight="400" text-anchor="start" class="mono faint">urgent</text>
<text x="586" y="122" font-size="18" font-weight="700" text-anchor="start">0.97</text>
<text x="586" y="140" font-size="11" font-weight="400" text-anchor="start" class="soft">вероятност за 'да'</text>
<text x="586" y="160" font-size="12" font-weight="400" text-anchor="start" class="mono faint">department</text>
<text x="586" y="182" font-size="18" font-weight="700" text-anchor="start">technical</text>
<text x="586" y="200" font-size="11" font-weight="400" text-anchor="start" class="soft">confidence 0.78</text>
<text x="586" y="220" font-size="12" font-weight="400" text-anchor="start" class="mono faint">severity</text>
<text x="586" y="242" font-size="18" font-weight="700" text-anchor="start">1.4</text>
<text x="586" y="260" font-size="11" font-weight="400" text-anchor="start" class="soft">между 1 и 2</text>
</svg>
