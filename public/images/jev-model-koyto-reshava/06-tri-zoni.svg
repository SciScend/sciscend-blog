<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="Три зони за действие според увереността; прагът расте с риска">
<title>Три зони за действие според увереността; прагът расте с риска</title>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif; fill: #353535; }
  .soft { fill: #5c5f63; } .faint { fill: #7a7e83; }
  .mono { font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .panel { fill: #f4f7f8; stroke: #e3e8ea; }
