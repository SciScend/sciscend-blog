<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="System One и System Two: бързото решение срещу бавното разсъждение">
<title>System One и System Two: бързото решение срещу бавното разсъждение</title>
<style>
  text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif; fill: #353535; }
  .soft { fill: #5c5f63; } .faint { fill: #7a7e83; }
  .mono { font-family: ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; }
  .panel { fill: #f4f7f8; stroke: #e3e8ea; }
  .card { fill: #ffffff; stroke: #d5dcdf; }
  .line { stroke: #9aa0a5; fill: none; }
  .ah { fill: #9aa0a5; }
  .grid { stroke: #e3e8ea; }
  .track { fill: #e3e8ea; }
  .jev { fill: #0b6f68; } .jevTint { fill: #e3f6f4; stroke: #13b0a5; } .jevInk { fill: #0b6f68; }
  .llm { fill: #0050a7; } .llmTint { fill: #e6eef8; stroke: #5b8fd0; } .llmInk { fill: #0050a7; }
  .hum { fill: #b86a00; } .humTint { fill: #fbf0e0; stroke: #d99a3e; } .humInk { fill: #8a4f00; }
  .mid { fill: #c9ced2; } .midTint { fill: #eef1f3; stroke: #b7bec3; }
  .bar2 { fill: #b8bdc1; }
  .onDark { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e7e9ea; }
    .soft { fill: #b3b8bc; } .faint { fill: #8b9196; }
    .panel { fill: #1b1f22; stroke: #2a3034; }
    .card { fill: #131618; stroke: #353c41; }
    .line { stroke: #6d7479; } .ah { fill: #6d7479; }
    .grid { stroke: #2a3034; } .track { fill: #2a3034; }
    .jev { fill: #2cc9bd; } .jevTint { fill: #15302e; stroke: #2cc9bd; } .jevInk { fill: #7fe3da; }
    .llm { fill: #6fb0ff; } .llmTint { fill: #16253a; stroke: #4d7fbf; } .llmInk { fill: #9cc8ff; }
    .hum { fill: #f0b050; } .humTint { fill: #35270f; stroke: #b8862e; } .humInk { fill: #f5c77a; }
    .mid { fill: #4a5156; } .midTint { fill: #22272b; stroke: #454c51; }
    .bar2 { fill: #5c6166; }
    .onDark { fill: #131618; }
  }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" class="ah"/>
  </marker>
</defs>

<rect x="20" y="20" width="345" height="290" rx="14" class="jevTint"/>
<text x="42" y="54" font-size="22" font-weight="700" text-anchor="start" class="jevInk">System One</text>
<text x="42" y="78" font-size="13" font-weight="400" text-anchor="start" class="soft">бързо | интуитивно | без усилие</text>
<rect x="395" y="20" width="345" height="290" rx="14" class="llmTint"/>
<text x="417" y="54" font-size="22" font-weight="700" text-anchor="start" class="llmInk">System Two</text>
<text x="417" y="78" font-size="13" font-weight="400" text-anchor="start" class="soft">бавно | последователно | с усилие</text>
<text x="42" y="124" font-size="20" font-weight="600" text-anchor="start">'Този имейл е спам.'</text>
<text x="42" y="150" font-size="13" font-weight="400" text-anchor="start" class="soft">частица от секундата, без да мислиш как</text>
<path d="M42,206 H64 Q68,206 68,210 V212 Q68,216 64,216 H42 Z" class="jev"/>
<text x="76" y="215" font-size="12" font-weight="400" text-anchor="start" class="faint">&lt; 1 s</text>
<text x="417" y="124" font-size="20" font-weight="600" text-anchor="start">17 x 24 = ?</text>
<text x="432" y="150" font-size="13" font-weight="400" text-anchor="start" class="soft mono">1.  17 x 20 = 340</text>
<text x="432" y="170" font-size="13" font-weight="400" text-anchor="start" class="soft mono">2.  17 x 4 = 68</text>
<text x="432" y="190" font-size="13" font-weight="400" text-anchor="start" class="soft mono">3.  340 + 68 = 408</text>
<path d="M417,206 H563 Q567,206 567,210 V212 Q567,216 563,216 H417 Z" class="llm"/>
<text x="575" y="215" font-size="12" font-weight="400" text-anchor="start" class="faint">стъпка по стъпка</text>
<line x1="42" y1="236" x2="343" y2="236" class="grid" stroke-width="1"/>
<text x="42" y="258" font-size="12" font-weight="400" text-anchor="start" class="faint">В ИИ:</text>
<text x="84" y="258" font-size="14" font-weight="700" text-anchor="start" class="jevInk">System One модел (Jev)</text>
<rect x="42" y="272" width="53" height="22" rx="11" class="card"/>
<text x="68.5" y="287" font-size="12" font-weight="400" text-anchor="middle" class="soft">избор</text>
<rect x="103" y="272" width="88" height="22" rx="11" class="card"/>
<text x="147.0" y="287" font-size="12" font-weight="400" text-anchor="middle" class="soft">вероятност</text>
<rect x="199" y="272" width="81" height="22" rx="11" class="card"/>
<text x="239.5" y="287" font-size="12" font-weight="400" text-anchor="middle" class="soft">70-500 ms</text>
<line x1="417" y1="236" x2="718" y2="236" class="grid" stroke-width="1"/>
<text x="417" y="258" font-size="12" font-weight="400" text-anchor="start" class="faint">В ИИ:</text>
<text x="459" y="258" font-size="14" font-weight="700" text-anchor="start" class="llmInk">LLM с reasoning (Claude, GPT...)</text>
<rect x="417" y="272" width="53" height="22" rx="11" class="card"/>
<text x="443.5" y="287" font-size="12" font-weight="400" text-anchor="middle" class="soft">текст</text>
<rect x="478" y="272" width="81" height="22" rx="11" class="card"/>
<text x="518.5" y="287" font-size="12" font-weight="400" text-anchor="middle" class="soft">обяснение</text>
<rect x="567" y="272" width="67" height="22" rx="11" class="card"/>
<text x="600.5" y="287" font-size="12" font-weight="400" text-anchor="middle" class="soft">секунди</text>
</svg>
